name: teloplay
description: "TeloPlay - YouTube Music Stream"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 🎵 Audio Playback
  media_kit: ^1.1.9
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.0.5

  # 🌐 Web audio playback for the InnerTube Worker web app
  just_audio: ^0.9.40
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  # 🎬 Declarative micro-interactions (hover/press/entrance). Used by the
  # responsive shell + Home carousels/grid. Kept to animation primitives
  # only — no new state-management or layout dependency.
  flutter_animate: ^4.5.0
  rxdart: ^0.28.0
  
  # 🔗 HTTP + Future Sync Prep
  http: ^1.2.2
  web: ^1.1.1
  web_socket_channel: ^3.0.1

  # 🖥️ System Tray (minimize to tray)
  system_tray: ^2.0.3
  window_manager: ^0.4.3
  # 🖥️ Windows taskbar thumbnail toolbar (hover preview-তে Spotify-style
  # [+] Fav / Prev / Play-Pause / Next buttons)। ITaskbarList3 wrap করে —
  # native C++ লেখা লাগে না।
  windows_taskbar: ^1.1.2

  audio_session: ^0.1.21
  # 🎧 Background Playback / OS Media Integration
  # Android: foreground service + MediaSession + notification + lock screen
  # + Bluetooth/headset button support (TeloPlayAudioHandler wraps
  # MusicPlayerRepository — playback logic stays inside the repository)
  audio_service: ^0.18.17
  # Windows: System Media Transport Controls (SMTC) — media flyout,
  # keyboard media keys, Bluetooth headset controls. audio_service has no
  # official Windows platform interface, so this is used independently
  # (WindowsMediaService wires it up on its own).
  # ⚠️ rustup must be installed for the build (flutter_rust_bridge/cargokit).
  smtc_windows: ^1.1.0
    # ... existing deps
  permission_handler: ^11.3.1

  # 🖼️ Image Caching (Phase 1 — Smart Performance Foundation)
  # Network image loading with disk + in-memory cache. Only
  # lib/widgets/cached_artwork.dart uses this package directly —
  # all other artwork/thumbnails go through that single wrapper widget.
  crypto: ^3.0.5

  # 🎨 Dynamic Album Accent (Phase 6 — Smart Player UI & Theme Polish)
  # For extracting the dominant color from album artwork. Only
  # lib/core/theme/color_extractor.dart uses this package directly —
  # the extracted color never goes straight to the UI, it is mapped
  # to a curated palette first (see the note in color_extractor.dart).
  palette_generator: ^0.3.3

  # 🔐 Auth (Supabase prep)
  supabase_flutter: ^2.8.3
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  drift_flutter: ^0.3.1
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  logger: ^2.7.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

# smtc_windows wants uuid ^4.5.1, system_tray is stuck on uuid ^3.0.6 —
# those two transitive constraints clash directly (version solving fails).
# system_tray only uses uuid for small/internal id generation internally
# (kept compatible from API v3 to v4), so overriding to the newer uuid
# is safe. Without this override `flutter pub get` will fail
dependency_overrides:
  uuid: ^4.5.1
  flutter_rust_bridge: 2.11.1
  storage_client: 2.6.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon.ico
    - assets/logo.png
    - assets/icon.png
    - assets/