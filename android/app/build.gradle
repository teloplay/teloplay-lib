plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.piyas.teloplay"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.piyas.teloplay"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    buildTypes {
    release {
        signingConfig = signingConfigs.debug
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
}
}

flutter {
    source = "../.."
}

dependencies {
    implementation files('libs/innertube.jar')
    implementation 'io.ktor:ktor-client-core:3.4.2'
    implementation 'io.ktor:ktor-client-okhttp:3.4.2'
    implementation 'io.ktor:ktor-client-content-negotiation:3.4.2'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.4.2'
    implementation 'io.ktor:ktor-client-encoding:3.4.2'
    implementation 'org.brotli:dec:0.1.2'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.3'
    implementation 'com.google.re2j:re2j:1.8'
    implementation 'org.mozilla:rhino:1.9.1'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
